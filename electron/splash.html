<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pine Opti</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;-webkit-app-region:drag;user-select:none}
  body{
    background:#06080f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#fff;
    position:relative;
    border-radius:18px;
    overflow:hidden;
  }
  /* Grid bg */
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(20,255,114,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(20,255,114,0.03) 1px,transparent 1px);
    background-size:36px 36px;
    pointer-events:none;
  }
  /* Glow orb */
  .orb{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-60%);
    width:500px;height:500px;
    background:radial-gradient(circle,rgba(20,255,114,0.08) 0%,transparent 65%);
    pointer-events:none;
  }
  .content{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    gap:24px;
  }
  /* Logo */
  .logo-wrap{position:relative;display:flex;align-items:center;justify-content:center}
  .ring1{
    position:absolute;
    width:96px;height:96px;
    border:1px dashed rgba(20,255,114,0.18);
    border-radius:50%;
    animation:spin 6s linear infinite;
  }
  .ring2{
    position:absolute;
    width:72px;height:72px;
    border:1px dashed rgba(0,204,255,0.1);
    border-radius:50%;
    animation:spin 9s linear infinite reverse;
  }
  .logo-box{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(135deg,#14ff72,#00d45e);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 40px rgba(20,255,114,0.5),0 0 80px rgba(20,255,114,0.15);
    position:relative;z-index:1;
  }
  /* Title */
  .title{
    text-align:center;line-height:1;
  }
  .title-main{
    font-size:28px;font-weight:900;letter-spacing:-0.05em;
  }
  .title-green{color:#14ff72;filter:drop-shadow(0 0 12px rgba(20,255,114,0.6))}
  .title-sub{
    margin-top:6px;font-size:9px;
    color:rgba(255,255,255,0.2);
    letter-spacing:0.22em;text-transform:uppercase;font-weight:600;
  }
  /* Progress */
  .progress-wrap{width:240px}
  .progress-bar{
    height:2px;background:rgba(255,255,255,0.05);
    border-radius:99px;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#14ff72,#00ccff);
    border-radius:99px;
    box-shadow:0 0 10px rgba(20,255,114,0.6);
    transition:width 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .progress-labels{
    margin-top:10px;display:flex;
    justify-content:space-between;align-items:center;
  }
  .phase-text{
    font-size:9.5px;color:rgba(255,255,255,0.22);
    letter-spacing:0.06em;font-family:'Courier New',monospace;
    transition:opacity 0.3s;
  }
  .pct{font-size:9.5px;color:#14ff72;opacity:0.7;font-family:'Courier New',monospace}
  /* Version */
  .ver{
    position:absolute;bottom:16px;
    font-size:8px;color:rgba(255,255,255,0.12);
    letter-spacing:0.15em;text-transform:uppercase;
  }
  /* Border glow */
  body::after{
    content:'';position:absolute;inset:0;
    border-radius:18px;
    border:1px solid rgba(20,255,114,0.1);
    pointer-events:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="orb"></div>

<div class="content">
  <!-- Logo -->
  <div class="logo-wrap">
    <div class="ring1"></div>
    <div class="ring2"></div>
    <div class="logo-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 12 L10 7 L15 12 L10 17 Z" fill="#000"/>
        <path d="M12 7 L17 12 L12 17" stroke="#000" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <div class="title">
    <div class="title-main">
      Pine <span class="title-green">Opti</span>
    </div>
    <div class="title-sub">Gaming Optimizer Suite · v1.2</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="fill"></div>
    </div>
    <div class="progress-labels">
      <span class="phase-text" id="phase">Iniciando sistema...</span>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
</div>

<div class="ver">Pine Opti v1.2.0 · Windows Gaming Suite</div>

<script>
const fill  = document.getElementById('fill');
const phase = document.getElementById('phase');
const pct   = document.getElementById('pct');

const steps = [
  { p: 18,  text: 'Detectando hardware...',       delay: 0   },
  { p: 38,  text: 'Cargando módulos...',           delay: 300 },
  { p: 58,  text: 'Inicializando Electron...',     delay: 650 },
  { p: 75,  text: 'Preparando interfaz...',        delay: 1000 },
  { p: 90,  text: 'Verificando anti-cheats...',   delay: 1350 },
  { p: 100, text: '¡Listo!',                       delay: 1700 },
];

steps.forEach(({ p, text, delay }) => {
  setTimeout(() => {
    fill.style.width  = p + '%';
    pct.textContent   = p + '%';
    phase.textContent = text;
  }, delay);
});
</script>
</body>
</html>
